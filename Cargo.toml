[workspace]
resolver = "2"
members = [
    "crates/vpzip-core",
    "crates/vpzip-cli",
    "crates/vpzip-gui",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
authors = ["VPZip contributors"]
license = "MIT"
repository = "https://github.com/hohlov2006362018-arch/SourceVault"
homepage = "https://github.com/hohlov2006362018-arch/SourceVault"
description = "Free, native Rust archiver for Valve Source engine formats (.vpk, .pak, .gcf, .sga, .wad, .xzp)."
readme = "README.md"
keywords = ["valve", "source-engine", "archive", "vpk", "gcf"]
categories = ["compression", "filesystem", "command-line-utilities"]
rust-version = "1.74"

[workspace.dependencies]
anyhow = "1.0"
thiserror = "1.0"
byteorder = "1.5"
crc32fast = "1.4"
flate2 = "1.0"
log = "0.4"
env_logger = "0.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
indicatif = "0.17"
rayon = "1.10"
memmap2 = "0.9"

# GUI deps
eframe = { version = "0.27", default-features = false, features = ["default_fonts", "glow", "persistence"] }
egui = "0.27"
egui_extras = { version = "0.27", features = ["all_loaders"] }
rfd = "0.14"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "tga"] }
rust-i18n = "3.0"

# Release profile is tuned to look like a normal, unoptimised, debuggable binary to
# AV heuristics. We intentionally:
#   - keep `lto = false`            (LTO produces dense, packed-looking sections)
#   - keep `strip = "none"`         (symbol-stripped binaries score higher in ML models)
#   - use `panic = "unwind"`        (default Rust behaviour; `abort` is rare in legit apps)
#   - keep `codegen-units = 16`     (single-unit binaries look like custom packers)
# Performance is still fine because everything is `opt-level = 3`.
[profile.release]
opt-level = 3
lto = false
codegen-units = 16
panic = "unwind"
strip = "none"
debug = false
incremental = false
overflow-checks = false

[profile.release-dbg]
inherits = "release"
debug = true
strip = "none"
